<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BizWise AI — the financial command center for founders</title>
    <meta
      name="description"
      content="BizWise AI turns your business numbers into a health score, cash runway, what-if scenarios and grounded advice from a business copilot."
    />
    <meta name="theme-color" content="#0b1f2a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      (function () {
        try {
          var stored = window.localStorage.getItem('bizwise-theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = mode === 'dark' || (mode === 'system' && systemDark);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* First paint falls back to the light palette. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
